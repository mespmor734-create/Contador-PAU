<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contador de Selectividad</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f7f7f5;
  color: #222;
}

.widget {
  max-width: 1050px;
  margin: auto;
  padding: 30px 20px;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.title {
  font-size: 20px;
  font-weight: 700;
}

.total {
  font-size: 64px;
  font-weight: 800;
  line-height: 1;
  margin-top: 12px;
}

.subtitle {
  color: #888;
  font-size: 14px;
  margin-top: 6px;
}

/* DOS COLUMNAS */

.grid {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 20px;
}

.card {
  background: white;
  border: 1px solid #e5e5e5;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.card-title {
  font-size: 16px;
  font-weight: 650;
  margin-bottom: 15px;
}

/* FORMULARIO */

label {
  display: block;
  font-size: 13px;
  color: #777;
  margin-top: 12px;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #888;
}

button {
  width: 100%;
  margin-top: 14px;
  padding: 12px;
  border: none;
  border-radius: 9px;
  background: #222;
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

button:hover {
  background: #444;
}

/* GRÁFICA */

.chart {
  height: 260px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 20px 5px 25px;
  border-bottom: 1px solid #ddd;
  overflow-x: auto;
}

.bar-container {
  min-width: 38px;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
}

.bar {
  width: 28px;
  min-height: 3px;
  background: #222;
  border-radius: 6px 6px 0 0;
  transition: height 0.3s;
}

.bar:hover {
  background: #555;
}

.bar-number {
  font-size: 11px;
  margin-bottom: 4px;
}

.bar-date {
  font-size: 10px;
  color: #888;
  margin-top: 7px;
  white-space: nowrap;
}

/* HISTORIAL */

.history {
  margin-top: 25px;
}

.day {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

.number {
  font-weight: 700;
}

.delete {
  width: auto;
  margin: 0;
  padding: 5px 9px;
  font-size: 12px;
  background: transparent;
  color: #999;
}

.delete:hover {
  background: #eee;
  color: #555;
}

.reset {
  margin-top: 20px;
  background: transparent;
  color: #999;
  font-size: 12px;
}

.reset:hover {
  background: #eee;
  color: #555;
}

/* MÓVIL */

@media (max-width: 700px) {

  .grid {
    grid-template-columns: 1fr;
  }

  .total {
    font-size: 52px;
  }

}
</style>
</head>

<body>

<div class="widget">

  <div class="header">

    <div class="title">
      🔴 SELECTIVIDAD
    </div>

    <div class="total" id="total">
      0
    </div>

    <div class="subtitle">
      veces mencionada en clase
    </div>

  </div>


  <div class="grid">

    <!-- AÑADIR RECUENTO -->

    <div class="card">

      <div class="card-title">
        Añadir recuento
      </div>

      <label for="date">
        Fecha
      </label>

      <input
        type="date"
        id="date"
      >

      <label for="amount">
        Veces que se dijo
      </label>

      <input
        type="number"
        id="amount"
        min="0"
        placeholder="Ej. 7"
      >

      <button onclick="addRecord()">
        Añadir recuento
      </button>

    </div>


    <!-- GRÁFICA -->

    <div class="card">

      <div class="card-title">
        📊 Evolución
      </div>

      <div
        class="chart"
        id="chart"
      >
      </div>

    </div>

  </div>


  <!-- HISTORIAL -->

  <div class="card history">

    <div class="card-title">
      Historial
    </div>

    <div id="history">
    </div>

    <button
      class="reset"
      onclick="resetCounter()"
    >
      Reiniciar todo el contador
    </button>

  </div>

</div>


<script>

/*
  CARGAR DATOS
*/

let data = JSON.parse(
  localStorage.getItem("selectividadData") || "{}"
);


/*
  FECHA DE HOY
*/

function getToday() {

  const now = new Date();

  const year = now.getFullYear();

  const month =
    String(now.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(now.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;
}


/*
  PONER HOY COMO FECHA POR DEFECTO
*/

document.getElementById("date").value =
  getToday();


/*
  AÑADIR UN REGISTRO
*/

function addRecord() {

  const date =
    document.getElementById("date").value;

  const amount =
    Number(
      document.getElementById("amount").value
    );


  if (!date) {

    alert("Selecciona una fecha.");

    return;
  }


  if (
    isNaN(amount) ||
    amount < 0
  ) {

    alert("Introduce un número válido.");

    return;
  }


  /*
    Si ya existe esa fecha,
    se suma al valor anterior.
  */

  data[date] =
    (data[date] || 0) + amount;


  save();


  document.getElementById("amount").value = "";

}


/*
  CALCULAR TOTAL
*/

function getTotal() {

  return Object.values(data)
    .reduce(
      (total, number) =>
        total + number,
      0
    );

}


/*
  GUARDAR
*/

function save() {

  localStorage.setItem(
    "selectividadData",
    JSON.stringify(data)
  );

  render();

}


/*
  FORMATEAR FECHA
*/

function formatDate(date) {

  return new Date(
    date + "T12:00:00"
  ).toLocaleDateString(
    "es-ES",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  );

}


/*
  RENDERIZAR TODO
*/

function render() {

  /*
    TOTAL
  */

  document.getElementById("total")
    .textContent =
    getTotal();


  /*
    FECHAS ORDENADAS
  */

  const dates =
    Object.keys(data)
      .sort();


  /*
    HISTORIAL
  */

  const history =
    document.getElementById("history");

  history.innerHTML = "";


  dates
    .slice()
    .reverse()
    .forEach(date => {

      const row =
        document.createElement("div");

      row.className = "day";


      row.innerHTML = `

        <span>
          ${formatDate(date)}
        </span>

        <span class="number">
          ${data[date]} veces
        </span>

        <button
          class="delete"
          onclick="deleteDate('${date}')"
        >
          ✕
        </button>

      `;


      history.appendChild(row);

    });


  /*
    GRÁFICA
  */

  renderChart(dates);

}


/*
  CREAR GRÁFICA
*/

function renderChart(dates) {

  const chart =
    document.getElementById("chart");

  chart.innerHTML = "";


  if (dates.length === 0) {

    chart.innerHTML =
      "<span style='color:#999'>Todavía no hay datos</span>";

    return;

  }


  /*
    Encontrar el valor máximo
  */

  const max =
    Math.max(
      ...dates.map(
        date => data[date]
      )
    );


  dates.forEach(date => {

    const container =
      document.createElement("div");

    container.className =
      "bar-container";


    const number =
      document.createElement("div");

    number.className =
      "bar-number";

    number.textContent =
      data[date];


    const bar =
      document.createElement("div");

    bar.className = "bar";


    /*
      Altura proporcional
    */

    const height =
      max === 0
        ? 3
        : (data[date] / max) * 180;


    bar.style.height =
      Math.max(height, 3) + "px";


    const dateLabel =
      document.createElement("div");

    dateLabel.className =
      "bar-date";


    /*
      Mostrar solo día/mes
    */

    const d =
      new Date(
        date + "T12:00:00"
      );

    dateLabel.textContent =
      String(d.getDate())
        .padStart(2, "0")
      + "/" +
      String(d.getMonth() + 1)
        .padStart(2, "0");


    container.appendChild(number);

    container.appendChild(bar);

    container.appendChild(dateLabel);

    chart.appendChild(container);

  });

}


/*
  BORRAR UN DÍA
*/

function deleteDate(date) {

  const confirmation =
    confirm(
      `¿Borrar el recuento del ${formatDate(date)}?`
    );


  if (!confirmation) return;


  delete data[date];

  save();

}


/*
  REINICIAR TODO
*/

function resetCounter() {

  const confirmation =
    confirm(
      "¿Seguro que quieres borrar TODO el historial?"
    );


  if (!confirmation) return;


  data = {};


  localStorage.removeItem(
    "selectividadData"
  );


  render();

}


/*
  INICIALIZAR
*/

render();

</script>

</body>
</html>
